name: Update Buyback Data

on:
  schedule:
    # KST = UTC+9. Weekday 08:30 KST (prices of previous close, late filings) and 19:30 KST (today's filings).
    - cron: "30 23 * * 0-4"
    - cron: "30 10 * * 1-5"
    # Retry slot at 22:30 KST in case an earlier run failed.
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
    inputs:
      budget_min:
        description: "Time budget in minutes (default 140)"
        required: false
        default: "140"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Collect data from DART and Naver
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/collect.py --since 20240101 --budget-min "${{ github.event.inputs.budget_min || '140' }}"

      - name: Commit and push data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git pull --rebase --autostash origin main || true
            git push
          fi
